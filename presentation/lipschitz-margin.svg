<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00449e"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e0561c"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a7d2a"/></marker>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9558b2"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
  </defs>

  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>

  <!-- ================= left panel ================= -->
  <text x="190" y="26" font-size="16" font-weight="600" fill="#1a3a6b" text-anchor="middle">What the bound assumes</text>
  <text x="190" y="46" font-size="13" fill="#666" text-anchor="middle">the 4 contributions aligned, all the same way</text>

  <!-- v1 .. v4 head to tail, horizontal -->
  <line x1="40" y1="150" x2="110" y2="150" stroke="#00449e" stroke-width="3.5" marker-end="url(#a1)"/>
  <line x1="110" y1="150" x2="142" y2="150" stroke="#e0561c" stroke-width="3.5" marker-end="url(#a2)"/>
  <line x1="142" y1="150" x2="212" y2="150" stroke="#2a7d2a" stroke-width="3.5" marker-end="url(#a3)"/>
  <line x1="212" y1="150" x2="244" y2="150" stroke="#9558b2" stroke-width="3.5" marker-end="url(#a4)"/>

  <text x="75" y="140" font-size="14" fill="#00449e" text-anchor="middle">v₁</text>
  <text x="126" y="140" font-size="14" fill="#e0561c" text-anchor="middle">v₂</text>
  <text x="177" y="140" font-size="14" fill="#2a7d2a" text-anchor="middle">v₃</text>
  <text x="228" y="140" font-size="14" fill="#9558b2" text-anchor="middle">v₄</text>

  <circle cx="40" cy="150" r="4" fill="#333"/>
  <text x="40" y="172" font-size="12" fill="#333" text-anchor="middle">g(c)</text>

  <!-- brace -->
  <path d="M40 196 v8 h204 v-8" fill="none" stroke="#333" stroke-width="1.4"/>
  <line x1="142" y1="204" x2="142" y2="212" stroke="#333" stroke-width="1.4"/>
  <text x="142" y="232" font-size="15" fill="#333" text-anchor="middle">Σ ‖vᵢ‖  =  dev</text>
  <text x="142" y="256" font-size="15" font-weight="600" fill="#c0392b" text-anchor="middle">5.45 cm</text>

  <!-- separator -->
  <line x1="380" y1="20" x2="380" y2="310" stroke="#ddd" stroke-width="1.5"/>

  <!-- ================= right panel ================= -->
  <text x="570" y="26" font-size="16" font-weight="600" fill="#1a3a6b" text-anchor="middle">What actually happens</text>
  <text x="570" y="46" font-size="13" fill="#666" text-anchor="middle">each joint pushes the foot elsewhere, they partly cancel</text>

  <!-- the resultant, drawn underneath -->
  <line x1="430" y1="230" x2="544" y2="161" stroke="#c0392b" stroke-width="3.5" stroke-dasharray="7 4" marker-end="url(#ar)"/>
  <text x="452" y="182" font-size="15" font-weight="600" fill="#c0392b">‖Σ vᵢ‖</text>

  <!-- same lengths as on the left, different directions, head to tail -->
  <line x1="430" y1="230" x2="500" y2="230" stroke="#00449e" stroke-width="3.5" marker-end="url(#a1)"/>
  <line x1="500" y1="230" x2="497" y2="198" stroke="#e0561c" stroke-width="3.5" marker-end="url(#a2)"/>
  <line x1="497" y1="198" x2="527" y2="135" stroke="#2a7d2a" stroke-width="3.5" marker-end="url(#a3)"/>
  <line x1="527" y1="135" x2="549" y2="157" stroke="#9558b2" stroke-width="3.5" marker-end="url(#a4)"/>

  <text x="465" y="249" font-size="14" fill="#00449e" text-anchor="middle">v₁</text>
  <text x="516" y="217" font-size="14" fill="#e0561c" text-anchor="middle">v₂</text>
  <text x="497" y="158" font-size="14" fill="#2a7d2a" text-anchor="middle">v₃</text>
  <text x="547" y="128" font-size="14" fill="#9558b2" text-anchor="middle">v₄</text>

  <circle cx="430" cy="230" r="4" fill="#333"/>
  <text x="420" y="249" font-size="12" fill="#333" text-anchor="middle">g(c)</text>
  <circle cx="549" cy="157" r="4" fill="#333"/>
  <text x="574" y="153" font-size="12" fill="#333" text-anchor="middle">g(θ)</text>

  <text x="570" y="270" font-size="15" fill="#333" text-anchor="middle">displacement actually possible</text>
  <text x="570" y="294" font-size="15" font-weight="600" fill="#2a7d2a" text-anchor="middle">3.8 cm  (measured, knees bent)</text>

  <!-- legend -->
  <text x="40" y="292" font-size="12" fill="#666">v₁ stance hip · v₂ stance knee</text>
  <text x="40" y="310" font-size="12" fill="#666">v₃ swing hip · v₄ swing knee</text>
</svg>
