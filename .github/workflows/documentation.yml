name: Documentation
on:
  push:
    branches: [master]
    tags: '*'
  pull_request:
    types: [opened, synchronize, reopened]
# Two docs runs racing (back-to-back pushes) fight over the gh-pages push and
# the loser fails with "fetch first" — cancel the superseded run instead.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install LaTeX
      run:  sudo apt-get update && sudo apt-get -y install ghostscript texlive texlive-latex-extra texlive-fonts-recommended cm-super dvipng     
    - uses: julia-actions/setup-julia@latest
      with:
        # Build documentation on the latest Julia 1.x
        version: '1'
    - name: Install dependencies
      shell: julia --project=docs/ {0}
      run: |
        using Pkg
        Pkg.add([
            PackageSpec(url="https://github.com/jump-dev/JuMP.jl", rev="master"),
            PackageSpec(path=pwd()),
        ])
        Pkg.instantiate()
    - name: Build and deploy
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For authentication with GitHub Actions token
        DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # For authentication with SSH deploy key
        GKSwstype: "100" # https://discourse.julialang.org/t/generation-of-documentation-fails-qt-qpa-xcb-could-not-connect-to-display/60988
      run: julia --project=docs/ docs/make.jl
