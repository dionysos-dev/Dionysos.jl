name: Documentation
on:
  push:
    branches: [master]
    tags: '*'
  pull_request:
    types: [opened, synchronize, reopened]
# Two docs runs racing (back-to-back pushes) fight over the gh-pages push and
# the loser fails with "fetch first" — cancel the superseded run instead.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # No TeX toolchain is installed on purpose. The site is HTML-only
    # (`Documenter.HTML`, math rendered by KaTeX in the browser) and no example
    # uses pgfplots or a `usetex` plotting backend, so nothing invokes a TeX
    # binary at build time. Installing texlive here used to dominate the job and
    # was wildly unreliable: 22 min on one run, 46 min on another, against a
    # 1.4 min nominal — all of it apt download time. Restore this step only if a
    # build actually fails for want of a TeX binary, and say which page needs it.
    - uses: julia-actions/setup-julia@latest
      with:
        # Build documentation on the latest Julia 1.x
        version: '1'
    # Without it every build re-resolves and re-precompiles the whole docs
    # environment — including JuMP from git master, which is never a cached
    # registry version. That step dominates the job.
    - uses: julia-actions/cache@v3
    - name: Install dependencies
      shell: julia --project=docs/ {0}
      run: |
        using Pkg
        Pkg.add([
            PackageSpec(url="https://github.com/jump-dev/JuMP.jl", rev="master"),
            PackageSpec(path=pwd()),
        ])
        Pkg.instantiate()
    - name: Build and deploy
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For authentication with GitHub Actions token
        DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # For authentication with SSH deploy key
        GKSwstype: "100" # https://discourse.julialang.org/t/generation-of-documentation-fails-qt-qpa-xcb-could-not-connect-to-display/60988
      run: julia --project=docs/ docs/make.jl
