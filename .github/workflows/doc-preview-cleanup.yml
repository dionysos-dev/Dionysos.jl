name: Doc Preview Cleanup

# Documenter deploys a preview of the docs to `gh-pages` under `previews/PR<n>`
# for every pull request (`push_preview = true` in `docs/make.jl`). Nothing ever
# removed them, so previews accumulated for years: 262 stale directories, 6.3 GiB
# of the branch, which is most of what a `git clone` of this repository transfers.
# This deletes a preview once its PR closes, and collapses `gh-pages` to a single
# commit so the deleted content stops shipping in the clone pack.
on:
  pull_request:
    types: [closed]

concurrency:
  group: doc-preview-cleanup
  cancel-in-progress: false

jobs:
  doc-preview-cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Delete the preview and collapse the branch history
        env:
          preview_dir: previews/PR${{ github.event.number }}
        run: |
          if [ -d "${preview_dir}" ]; then
            git config user.name "Documenter.jl"
            git config user.email "documenter@juliadocs.github.io"
            git rm -rf "${preview_dir}"
            git commit -m "delete preview"
            git branch gh-pages-new $(echo "delete history" | git commit-tree HEAD^{tree})
            git push --force origin gh-pages-new:gh-pages
          fi
